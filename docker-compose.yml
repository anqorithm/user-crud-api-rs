services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP__DATABASE_URL=postgres://postgres:postgres@postgres:5432/users_db
      - APP__REDIS_URL=redis://redis:6379
      - APP__JWT_SECRET=your-super-secret-key-change-in-production
      - APP__JWT_EXPIRATION_HOURS=24
      - APP__JWT_REFRESH_EXPIRATION_DAYS=7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: